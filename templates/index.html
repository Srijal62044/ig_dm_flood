<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Tools</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f0f0f; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 28px; width: 100%; max-width: 480px; }
    h1 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #aaa; }
    input, select, textarea { width: 100%; padding: 10px 12px; margin-bottom: 14px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 0.95rem; }
    textarea { min-height: 80px; resize: vertical; }
    button { width: 100%; padding: 12px; background: #e1306c; border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 8px; }
    button:hover { background: #c13584; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .secondary { background: #333; }
    .secondary:hover { background: #444; }
    .msg { margin-top: 10px; text-align: center; font-size: 0.9rem; white-space: pre-wrap; }
    .hidden { display: none; }
    .thread-item { background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 0.85rem; cursor: pointer; }
    .thread-item:hover { border-color: #e1306c; }
    .thread-id { color: #e1306c; font-family: monospace; }
    #threadList { max-height: 300px; overflow-y: auto; margin-top: 12px; }
    .challenge-box { background: #2a1a1a; border: 1px solid #e1306c; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IG DM Tool</h1>

    <label>Instagram Username</label>
    <input type="text" id="username" placeholder="username">

    <label>Password</label>
    <input type="password" id="password" placeholder="password">

    <label>Mode</label>
    <select id="mode" onchange="toggleMode()">
      <option value="users">Flood Users</option>
      <option value="group">Flood Group Thread</option>
      <option value="list">List My Threads</option>
    </select>

    <div id="usersBox">
      <label>Target Usernames (comma separated)</label>
      <input type="text" id="targets" placeholder="user1, user2, user3">
    </div>

    <div id="groupBox" class="hidden">
      <label>Thread ID</label>
      <input type="text" id="thread_id" placeholder="3402823668417103...">
    </div>

    <div id="messageBox">
      <label>Message</label>
      <textarea id="message" placeholder="message to spam"></textarea>

      <label>How many times</label>
      <input type="number" id="count" value="1" min="1">
    </div>

    <!-- Challenge / OTP Box -->
    <div id="challengeBox" class="challenge-box hidden">
      <label>OTP / 2FA / Challenge Code</label>
      <input type="text" id="verification_code" placeholder="6 digit code">
      <input type="hidden" id="session_id">
      <button class="secondary" onclick="submitCode()">Submit Code</button>
    </div>

    <button id="btn" onclick="startFlood()">Start</button>
    <div class="msg" id="status"></div>
    <div id="threadList"></div>
  </div>

  <script>
    function toggleMode() {
      const mode = document.getElementById("mode").value;
      document.getElementById("usersBox").classList.toggle("hidden", mode !== "users");
      document.getElementById("groupBox").classList.toggle("hidden", mode !== "group");
      document.getElementById("messageBox").classList.toggle("hidden", mode === "list");
      document.getElementById("threadList").innerHTML = "";
      document.getElementById("status").textContent = "";
      document.getElementById("challengeBox").classList.add("hidden");
    }

    async function startFlood() {
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      const threadList = document.getElementById("threadList");
      btn.disabled = true;
      status.textContent = "Working...";
      threadList.innerHTML = "";
      document.getElementById("challengeBox").classList.add("hidden");

      const payload = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
        mode: document.getElementById("mode").value,
        targets: document.getElementById("targets").value,
        thread_id: document.getElementById("thread_id").value,
        message: document.getElementById("message").value,
        count: document.getElementById("count").value
      };

      try {
        const res = await fetch("/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.need_code) {
          document.getElementById("session_id").value = data.session_id;
          document.getElementById("challengeBox").classList.remove("hidden");
          status.textContent = data.msg;
        } else if (payload.mode === "list" && data.ok) {
          status.textContent = "Threads loaded. Click karke thread_id copy kar.";
          data.threads.forEach(t => {
            const div = document.createElement("div");
            div.className = "thread-item";
            div.innerHTML = `<div><b>${t.title}</b></div>
                             <div class="thread-id">${t.thread_id}</div>
                             <div style="color:#888;margin-top:4px">${t.users}</div>`;
            div.onclick = () => {
              document.getElementById("thread_id").value = t.thread_id;
              document.getElementById("mode").value = "group";
              toggleMode();
              status.textContent = "Thread ID fill ho gaya.";
            };
            threadList.appendChild(div);
          });
        } else {
          status.textContent = data.msg;
        }
      } catch (e) {
        status.textContent = "Server error";
      }
      btn.disabled = false;
    }

    async function submitCode() {
      const status = document.getElementById("status");
      status.textContent = "Code submit kar raha hoon...";

      const payload = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
        verification_code: document.getElementById("verification_code").value,
        session_id: document.getElementById("session_id").value,
        mode: document.getElementById("mode").value,
        targets: document.getElementById("targets").value,
        thread_id: document.getElementById("thread_id").value,
        message: document.getElementById("message").value,
        count: document.getElementById("count").value
      };

      try {
        const res = await fetch("/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.ok) {
          document.getElementById("challengeBox").classList.add("hidden");
          status.textContent = data.msg;

          if (payload.mode === "list" && data.threads) {
            const threadList = document.getElementById("threadList");
            data.threads.forEach(t => {
              const div = document.createElement("div");
              div.className = "thread-item";
              div.innerHTML = `<div><b>${t.title}</b></div>
                               <div class="thread-id">${t.thread_id}</div>
                               <div style="color:#888;margin-top:4px">${t.users}</div>`;
              div.onclick = () => {
                document.getElementById("thread_id").value = t.thread_id;
                document.getElementById("mode").value = "group";
                toggleMode();
                status.textContent = "Thread ID fill ho gaya.";
              };
              threadList.appendChild(div);
            });
          }
        } else {
          status.textContent = data.msg;
        }
      } catch (e) {
        status.textContent = "Error submitting code";
      }
    }
  </script>
</body>
</html>
